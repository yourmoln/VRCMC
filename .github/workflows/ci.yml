name: CI

on:
  pull_request:
    branches: [main]

# 同一个 PR 的新提交会取消上一次还在跑的检查。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check (tests and release build)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # 与 scripts/release.ps1 的测试范围一致（桌面 + Android 单元测试），
      # 并额外构建一次 Release APK，提前暴露 R8/资源收缩问题。
      # PR 环境没有签名 Secrets，这里只验证能否构建（产物为未签名 APK）。
      - name: Run tests and build release APK
        shell: pwsh
        run: |
          .\gradlew.bat --console=plain --stacktrace :composeApp:desktopTest :composeApp:testDebugUnitTest :composeApp:assembleRelease
          exit $LASTEXITCODE
