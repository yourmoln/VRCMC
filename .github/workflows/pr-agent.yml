name: PR Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, review_requested]
  issue_comment:
    types: [created]

jobs:
  pr_agent:
    # Ignore comments and events generated by bots, and only handle comments on PRs.
    if: ${{ github.event.sender.type != 'Bot' && (github.event_name == 'pull_request' || github.event.issue.pull_request) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      checks: write
    steps:
      - name: Run PR Agent
        uses: the-pr-agent/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          OPENAI__API_BASE: ${{ secrets.OPENAI_API_BASE }}
          CONFIG__MODEL: gpt-5.6-sol
          CONFIG__RESPONSE_LANGUAGE: zh-CN
          GITHUB_ACTION_CONFIG__AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG__AUTO_DESCRIBE: "true"
          GITHUB_ACTION_CONFIG__AUTO_IMPROVE: "true"
