name: PR Agent

on:
  pull_request_target:
    types: [labeled]

jobs:
  pr_agent:
    # Only a maintainer-applied ai/needs-review label can start the review.
    if: ${{ github.event.sender.type != 'Bot' && github.event.label.name == 'ai/needs-review' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      checks: write
    steps:
      - name: Mark PR as in review
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number,
              labels: ['ai/in-review'],
            });

            try {
              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number,
                name: 'ai/needs-review',
              });
            } catch (error) {
              // The label may already have been removed by a concurrent run.
              if (error.status !== 404) throw error;
            }

      - name: Run PR Agent
        uses: the-pr-agent/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          OPENAI__API_BASE: ${{ secrets.OPENAI_API_BASE }}
          CONFIG__MODEL: gpt-5.6-sol
          CONFIG__RESPONSE_LANGUAGE: zh-CN
          GITHUB_ACTION_CONFIG__AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG__AUTO_DESCRIBE: "true"
          GITHUB_ACTION_CONFIG__AUTO_IMPROVE: "true"
